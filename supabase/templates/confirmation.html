<div style="background:#FAF7F2;padding:40px 24px;font-family:Georgia,'Times New Roman',serif;color:#302827">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #EAD7D5;border-radius:16px;padding:32px">
    <p style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#682D42;margin:0 0 8px">Our Wedding Era</p>
    <h1 style="font-weight:normal;font-size:26px;margin:0 0 16px">Confirm your email</h1>
    <p style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6">
      Tap the button below to confirm this address and finish creating your account.
    </p>
    <p style="margin:28px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
         style="background:#682D42;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:999px;font-family:Arial,Helvetica,sans-serif;font-size:15px">
        Confirm my email
      </a>
    </p>
    <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#6b5d5b">
      If you didn't create an account, you can ignore this message.
    </p>
  </div>
</div>
